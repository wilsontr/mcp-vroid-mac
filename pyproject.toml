[project]
name = "mcp-vroid-mac"
version = "0.1.0"
description = "Drive the native macOS VRoid Studio from any MCP client - screen capture, OCR and Quartz input"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nuri Hodges" },
    { name = "Trevor Wilson" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "vroid",
    "vrm",
    "gui-automation",
    "macos",
    "quartz",
    "3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
mcp-vroid-mac = "mcp_vroid.server:main"
vroid-driver-mac = "mcp_vroid.driver.cli:main"

[project.urls]
Homepage = "https://github.com/wilsontr/mcp-vroid-mac"
Repository = "https://github.com/wilsontr/mcp-vroid-mac"
Issues = "https://github.com/wilsontr/mcp-vroid-mac/issues"
Upstream = "https://github.com/nhodges/mcp-vroid"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vroid"]
